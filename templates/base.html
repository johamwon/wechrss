<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="将微信公众号文章整理为属于自己的 RSS 订阅。">
  <meta name="theme-color" content="#16845b">
  <link rel="manifest" href="/static/manifest.json">
  <title>{% block title %}WeRSS{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  <script src="/static/app.js?v={{ app_version }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="app-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="WeRSS 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28"><path d="M5 5.5h18v12H12l-7 5v-17Z"/><path d="M11 11h10v7h-5l-5 4v-11Z"/></svg>
      </span>
      <span><strong>WeRSS</strong><small>微信公众号订阅助手</small></span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a href="/" {% if active_page == 'dashboard' %}class="active" aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg>
        <span>订阅</span>
      </a>
      <a href="/sources/new" {% if active_page == 'add' %}class="active" aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"/></svg>
        <span>添加</span>
      </a>
      <a href="/search" {% if active_page == 'search' %}class="active" aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <span>搜索</span>
      </a>
      <a href="/settings" {% if active_page == 'settings' %}class="active" aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <a class="account-chip {{ 'online' if credential_status.configured else 'offline' }}" href="/settings#login">
      <span class="status-dot" aria-hidden="true"></span>
      <span>{{ credential_status.name or ('微信读书已连接' if credential_status.configured else '未登录') }}</span>
    </a>
  </div>
</header>

<main id="main-content" class="shell page-content" tabindex="-1">
  {% if message %}<div class="flash success" role="status"><span aria-hidden="true">✓</span><div>{{ message }}</div><button type="button" data-dismiss aria-label="关闭提示">×</button></div>{% endif %}
  {% if error %}<div class="flash error" role="alert"><span aria-hidden="true">!</span><div>{{ error }}</div><button type="button" data-dismiss aria-label="关闭提示">×</button></div>{% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="shell app-footer">
  <p>WeRSS <span>v{{ app_version }}</span></p>
  <p>尊重平台规则，低频同步，不绕过风控验证</p>
  <p class="footer-contact">扫码联系作者 <a href="/static/qrcode.png" target="_blank" rel="noopener"><img src="/static/qrcode.png" alt="作者微信二维码" width="48" height="48"></a></p>
</footer>
<div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
